name: Supabase Keep Alive

on:
  schedule:
    - cron: "0 6 */3 * *"   # Every 3 days at 6 AM UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Curl Supabase
        run: |
          curl -X GET "https://slmkfqjpqrztkmuleerv.supabase.co/rest/v1/transactions?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
