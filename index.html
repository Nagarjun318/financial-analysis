<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinanceHub - Your Complete Financial Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gray: {
              50: '#fafafa',
              100: '#f4f4f5',
              200: '#e4e4e7',
              300: '#d4d4d8',
              400: '#a1a1aa',
              500: '#71717a',
              600: '#52525b',
              700: '#3f3f46',
              800: '#27272a',
              900: '#18181b',
              950: '#09090b',
            },
            'brand-primary': '#6366f1', // Indigo 500
            'brand-secondary': '#10b981', // Emerald 500
            'light-bg': '#ffffff',
            'dark-bg': '#09090b', // Zinc 950
            'light-card': '#f8fafc',
            'dark-card': '#18181b', // Zinc 900
            'light-text': '#0f172a', // Slate 900
            'dark-text': '#e4e4e7', // Zinc 200
            'light-text-secondary': '#475569', // Slate 600
            'dark-text-secondary': '#a1a1aa', // Zinc 400
          }
        }
      }
    }
  </script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.546.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.3.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.26.0",
    "react-dropzone": "https://aistudiocdn.com/react-dropzone@^14.3.8",
    "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.45.0"
  }
}
</script>
</head>

<body
  class="min-h-screen bg-light-bg dark:bg-dark-bg text-light-text dark:text-dark-text transition-colors duration-300">
  <style>
    /* Accent gradient / rainbow text utilities */
    .gradient-text {
      background: linear-gradient(90deg, #22d3ee, #818cf8, #c084fc, #f472b6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .rainbow-text {
      background: linear-gradient(120deg, #fb923c, #fbbf24, #34d399, #38bdf8, #818cf8, #c084fc, #f472b6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .glass-panel {
      position: relative;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.6);
    }

    .dark .glass-panel {
      background: rgba(24, 24, 27, 0.75);
      /* Zinc 900 @ 75% */
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .animated-border {
      position: relative;
    }

    .animated-border::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(110deg, #6366f1, #0ea5e9, #10b981, #f59e0b, #ec4899, #8b5cf6, #6366f1);
      background-size: 400% 400%;
      animation: borderShift 14s linear infinite;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: .3;
    }

    .dark .animated-border::after {
      opacity: .5;
    }

    @keyframes borderShift {
      to {
        background-position: 400% 0;
      }
    }

    @keyframes pulseGradient {

      0%,
      100% {
        filter: hue-rotate(0deg);
      }

      50% {
        filter: hue-rotate(40deg);
      }
    }

    .gradient-table-row:hover {
      background: rgba(241, 245, 249, 0.8);
    }

    .dark .gradient-table-row:hover {
      background: rgba(39, 39, 42, 0.6);
      /* Zinc 800 */
    }

    .chart-legend-accent {
      font-size: 12px;
      letter-spacing: .5px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .animate-fadeIn {
      animation: fadeIn 0.5s ease-out forwards;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-slideUp {
      animation: slideUp 0.5s ease-out forwards;
    }
  </style>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
