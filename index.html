    <title>FinanceHub - Your Complete Financial Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-primary': '#4f46e5',
              'brand-secondary': '#10b981',
              'light-bg': '#ffffff',
              'dark-bg': '#0a0a0a',
              'light-card': '#f8fafc',
              'dark-card': '#1a1a1a',
              'light-text': '#0f172a',
              'dark-text': '#f1f5f9',
              'light-text-secondary': '#475569',
              'dark-text-secondary': '#cbd5e1',
            }
          }
        }
      }
    </script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.546.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.3.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.26.0",
    "react-dropzone": "https://aistudiocdn.com/react-dropzone@^14.3.8",

  }
}
</script>
</head>
  <body class="min-h-screen bg-light-bg dark:bg-dark-bg text-light-text dark:text-dark-text">
    <style>
      /* Accent gradient / rainbow text utilities */
      .gradient-text {
        background: linear-gradient(90deg,#06b6d4,#6366f1,#8b5cf6,#ec4899);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .rainbow-text {
        background: linear-gradient(120deg,#f97316,#f59e0b,#10b981,#0ea5e9,#6366f1,#8b5cf6,#ec4899);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .glass-panel {
        position: relative;
        background: rgba(248, 250, 252, 0.95);
        backdrop-filter: blur(10px) saturate(120%);
        -webkit-backdrop-filter: blur(10px) saturate(120%);
        border: 1px solid rgba(148, 163, 184, 0.2);
      }
      .dark .glass-panel { 
        background: rgba(26, 26, 26, 0.95);
        border: 1px solid rgba(71, 85, 105, 0.3);
      }
      .animated-border {
        position: relative;
      }
      .animated-border::after {
        content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 2px;
        background: linear-gradient(110deg,#4f46e5,#0ea5e9,#10b981,#f59e0b,#ec4899,#8b5cf6,#4f46e5);
        background-size: 400% 400%;
        animation: borderShift 14s linear infinite;
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor; mask-composite: exclude;
        pointer-events: none;
        opacity: .4;
      }
      .dark .animated-border::after {
        opacity: .6;
      }
      @keyframes borderShift { to { background-position: 400% 0; } }
      @keyframes pulseGradient { 0%,100% { filter: hue-rotate(0deg); } 50% { filter: hue-rotate(40deg); } }
      .gradient-table-row:hover { 
        background: rgba(226, 232, 240, 0.5);
      }
      .dark .gradient-table-row:hover { 
        background: rgba(51, 65, 85, 0.3);
      }
      .chart-legend-accent { font-size: 12px; letter-spacing: .5px; }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
